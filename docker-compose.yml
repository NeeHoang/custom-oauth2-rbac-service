version: '3.8'

services:
  postgres:
    image: postgres:15
    container_name: postgres_auth
    restart: always
    environment:
      POSTGRES_USER: auth_LeVietHoang
      POSTGRES_PASSWORD: auth_13022004
      POSTGRES_DB: auth_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  redis:
    image: redis:7
    container_name: redis_auth
    restart: always
    command: ["redis-server", "--appendonly", "yes"] # persist
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data

volumes:
  postgres_data:
  redis_data:

